<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nobar Space - Co-Watching App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Trystero Nostr Strategy (Lebih stabil untuk GitHub Pages / HTTPS) -->
  <script src="https://cdn.jsdelivr.net/npm/trystero@0.18.2/dist/trystero-nostr.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Container Utama -->
  <div class="w-full max-w-4xl bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700">
    
    <!-- Header & Indikator Koneksi -->
    <div class="p-4 bg-slate-950 flex flex-wrap justify-between items-center border-b border-slate-700 gap-4">
      <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
        🎬 Nobar Space
      </h1>
      <div id="connection-status" class="flex items-center gap-2 text-sm text-yellow-400 font-medium bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse"></span>
        Belum Terhubung
      </div>
    </div>

    <!-- Panel Kontrol Ruangan & Input Video -->
    <div class="p-4 bg-slate-800 border-b border-slate-700 grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Input Room ID -->
      <div class="flex gap-2">
        <input type="text" id="room-id-input" placeholder="Masukkan Nama Ruangan (mis: nobar-kita)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
        <button onclick="joinRoom()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition-colors shrink-0">
          Masuk
        </button>
      </div>

      <!-- Input URL Video -->
      <div class="flex gap-2">
        <input type="text" id="video-url-input" placeholder="URL Video (.mp4 / direct link)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
        <button onclick="changeMediaUrl()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors shrink-0">
          Muat Video
        </button>
      </div>
    </div>

    <!-- Area Video Player -->
    <div class="relative bg-black aspect-video flex items-center justify-center">
      <video id="media-player" class="w-full h-full" controls crossorigin="anonymous">
        <source id="video-source" src="" type="video/mp4">
        Browser Anda tidak mendukung pemutar video HTML5.
      </video>
    </div>

    <!-- Area Log & Chat -->
    <div class="p-4 bg-slate-950 border-t border-slate-700">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Log Aktivitas</h2>
      <div id="activity-log" class="h-28 overflow-y-auto bg-slate-900 p-3 rounded-lg text-xs space-y-1 font-mono text-slate-300 border border-slate-800">
        <div>[System] Silakan masukkan nama ruangan untuk memulai.</div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 hidden px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-all transform translate-y-2"></div>

  <!-- Application Logic -->
  <script>
    // Inisialisasi Trystero dari global CDN
    const { joinRoom: trysteroJoinRoom } = window.trysteroNostr;
    
    let room = null;
    let sendMediaState = null;
    let getMediaState = null;
    let sendChangeUrl = null;
    let getChangeUrl = null;
    let isRemoteAction = false;

    const player = document.getElementById('media-player');
    const logContainer = document.getElementById('activity-log');
    const statusDiv = document.getElementById('connection-status');

    function log(message) {
      const entry = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      entry.textContent = `[${time}] ${message}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `fixed bottom-5 right-5 px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-all ${
        type === 'error' ? 'bg-red-600 text-white' : 
        type === 'success' ? 'bg-emerald-600 text-white' : 'bg-indigo-600 text-white'
      }`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function updateConnectionStatus(isConnected) {
      if (isConnected) {
        statusDiv.className = 'flex items-center gap-2 text-sm text-emerald-400 font-medium bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800';
        statusDiv.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Pasangan Terhubung';
      } else {
        statusDiv.className = 'flex items-center gap-2 text-sm text-yellow-400 font-medium bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800';
        statusDiv.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse"></span> Menunggu Pasangan...';
      }
    }

    function joinRoom() {
      const roomIdInput = document.getElementById('room-id-input');
      const roomName = roomIdInput.value.trim();

      if (!roomName) {
        showToast('Masukkan nama ruangan terlebih dahulu!', 'error');
        return;
      }

      // Konfigurasi Relay Nostr Publik (Stabil & ramah HTTPS)
      const config = { 
        appId: 'nobar-space-v1',
        relays: [
          'wss://relay.damus.io',
          'wss://nos.lol',
          'wss://relay.nostr.band'
        ]
      };

      try {
        if (room) room.leave();
        
        room = trysteroJoinRoom(config, roomName);
        log(`Bergabung ke ruangan: "${roomName}"`);
        showToast(`Berhasil masuk ruangan: ${roomName}`, 'success');

        // Event listener peers
        room.onPeerJoin(peerId => {
          log(`Pasangan terhubung! (ID: ${peerId.substring(0, 6)}...)`);
          updateConnectionStatus(true);
          showToast('Pasangan telah bergabung!', 'success');
        });

        room.onPeerLeave(peerId => {
          log(`Pasangan terputus.`);
          updateConnectionStatus(false);
          showToast('Pasangan keluar dari ruangan.', 'error');
        });

        // Setup channel komunikasi P2P
        [sendMediaState, getMediaState] = room.makeAction('mediaState');
        [sendChangeUrl, getChangeUrl] = room.makeAction('changeUrl');

        // Listen sinkronisasi status (Play/Pause/Seek)
        getMediaState((data) => {
          isRemoteAction = true;
          if (Math.abs(player.currentTime - data.time) > 0.5) {
            player.currentTime = data.time;
          }
          if (data.type === 'play' && player.paused) {
            player.play().catch(() => {});
            log('Pasangan memutar video.');
          } else if (data.type === 'pause' && !player.paused) {
            player.pause();
            log('Pasangan menjeda video.');
          } else if (data.type === 'seek') {
            log(`Pasangan melompati durasi ke ${Math.round(data.time)}s.`);
          }
          setTimeout(() => { isRemoteAction = false; }, 200);
        });

        // Listen perubahan URL video
        getChangeUrl((url) => {
          log(`Menerima URL video baru dari pasangan.`);
          document.getElementById('video-source').src = url;
          player.load();
          showToast('URL video telah diperbarui oleh pasangan.', 'info');
        });

      } catch (err) {
        log(`Gagal terhubung: ${err.message}`);
        showToast('Gagal menghubungkan ke ruangan.', 'error');
      }
    }

    function changeMediaUrl() {
      const urlInput = document.getElementById('video-url-input');
      const url = urlInput.value.trim();

      if (!url) {
        showToast('Masukkan URL video yang valid!', 'error');
        return;
      }

      document.getElementById('video-source').src = url;
      player.load();
      log(`Memuat video baru: ${url}`);

      if (sendChangeUrl) {
        sendChangeUrl(url);
      }
    }

    // Event listener player untuk mengirim perintah ke pasangan
    player.addEventListener('play', () => {
      if (!isRemoteAction && sendMediaState) {
        sendMediaState({ type: 'play', time: player.currentTime });
        log('Memutar video...');
      }
    });

    player.addEventListener('pause', () => {
      if (!isRemoteAction && sendMediaState) {
        sendMediaState({ type: 'pause', time: player.currentTime });
        log('Menjeda video...');
      }
    });

    player.addEventListener('seeked', () => {
      if (!isRemoteAction && sendMediaState) {
        sendMediaState({ type: 'seek', time: player.currentTime });
      }
    });
  </script>
</body>
</html>
