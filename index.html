<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Nobar Space - Sinkronisasi Video Real-Time</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS CDN untuk koneksi P2P Real-time -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    /* Format penuh untuk iframe YouTube dan pemutar HTML5 */
    #player-frame, #html5-player {
      width: 100% !important;
      height: 100% !important;
      min-height: 260px;
      border: 0;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden antialiased">

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header Navigasi -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3 z-10">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-indigo-500"></div>
      <div>
        <h1 class="font-semibold text-sm sm:text-base leading-none text-slate-100 tracking-tight">NOBAR SPACE</h1>
        <p class="text-[11px] text-slate-400 mt-1">Platform Sinkronisasi Media Real-Time</p>
      </div>
    </div>

    <!-- Status Koneksi & ID Peer -->
    <div class="flex flex-wrap items-center gap-2 text-xs">
      <!-- ID Saya -->
      <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-md flex items-center gap-2">
        <span class="text-slate-400">ID Anda:</span>
        <span id="my-id" class="font-mono font-medium text-slate-200">Menghubungkan...</span>
        <button onclick="copyMyId()" class="text-slate-400 hover:text-slate-200 transition font-medium border-l border-slate-800 pl-2 ml-1">
          Salin
        </button>
        <button onclick="reconnectPeerServer()" class="text-indigo-400 hover:text-indigo-300 transition font-medium border-l border-slate-800 pl-2" title="Reset/Coba Ulang Server">
          Coba Ulang
        </button>
      </div>

      <!-- Input ID Partner -->
      <div class="flex items-center gap-1.5">
        <input id="partner-id-input" type="text" placeholder="Masukkan ID Pasangan..." class="bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 w-36 sm:w-44 transition">
        <button onclick="connectToPartner()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3.5 py-1.5 rounded-md transition shadow-sm">
          Hubungkan
        </button>
      </div>

      <!-- Indikator Status -->
      <div id="status-badge" class="flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-md font-medium text-slate-400">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
        <span id="status-text">Belum Terhubung</span>
      </div>
    </div>
  </header>

  <!-- Area Utama App -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
    
    <!-- Area Pemutar Video -->
    <div class="flex-1 flex flex-col p-4 bg-slate-900/30 overflow-y-auto">
      
      <!-- Input Video URL -->
      <form onsubmit="changeVideoHandler(event)" class="flex gap-2 mb-2">
        <input id="video-url-input" type="text" placeholder="Masukkan URL YouTube, Vimeo, atau link MP4 langsung..." class="flex-1 bg-slate-900 border border-slate-800 rounded-md px-3.5 py-2 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs sm:text-sm font-medium px-4 py-2 rounded-md transition shrink-0">
          Muat Video
        </button>
      </form>

      <!-- Rekomendasi / Contoh Video & Sakelar Domain -->
      <div class="flex items-center justify-between gap-2 mb-3 text-[11px] text-slate-400 flex-wrap">
        <div class="flex items-center gap-2 flex-wrap">
          <span>Contoh Video:</span>
          <button onclick="loadSampleVideo('dQw4w9WgXcQ', 'yt')" class="hover:text-indigo-400 underline">Rick Astley (YouTube)</button>
          <span>•</span>
          <button onclick="loadSampleVideo('761022891', 'vimeo')" class="hover:text-indigo-400 underline">Demo (Vimeo)</button>
          <span>•</span>
          <button onclick="loadSampleVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'direct')" class="hover:text-indigo-400 underline">Video MP4 Langsung</button>
        </div>

        <!-- Mode Sakelar YouTube Embed -->
        <button onclick="toggleYtDomain()" id="yt-domain-btn" class="text-[10px] bg-slate-900 border border-slate-800 hover:border-slate-700 px-2 py-1 rounded text-slate-400 transition">
          Domain: YouTube Standard
        </button>
      </div>

      <!-- Video Player Frame Container -->
      <div class="flex-1 bg-black rounded-lg overflow-hidden relative shadow-2xl min-h-[250px] sm:min-h-[380px] flex items-center justify-center border border-slate-800">
        <!-- Target Pemutar Container Iframe (YouTube / Vimeo / Generic) -->
        <div id="embed-player-container" class="w-full h-full">
          <iframe 
            id="player-frame"
            class="w-full h-full"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&autoplay=0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>

        <!-- HTML5 Video Player (Untuk File MP4) -->
        <video id="html5-player" class="hidden w-full h-full bg-black" controls></video>

        <!-- Floating Emoji Overlay -->
        <div id="emoji-overlay" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
      </div>

      <!-- Kontrol Tambahan & Bar Reaksi -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-2 mt-3 p-2 bg-slate-900 border border-slate-800 rounded-lg">
        
        <!-- Tombol Aba-Aba Sinkronisasi -->
        <div id="sync-tools" class="flex items-center gap-2 w-full sm:w-auto">
          <button onclick="sendSyncSignal('PLAY')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded transition font-medium">
            Aba-Aba Play
          </button>
          <button onclick="sendSyncSignal('PAUSE')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded transition font-medium">
            Aba-Aba Pause
          </button>
        </div>

        <!-- Reaksi Emoji -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-around border-t sm:border-t-0 border-slate-800 pt-2 sm:pt-0">
          <span class="text-xs text-slate-400 font-medium hidden sm:inline mr-1">Reaksi:</span>
          <button onclick="sendEmoji('❤️')" class="text-lg p-1.5 hover:bg-slate-800 rounded transition active:scale-90">❤️</button>
          <button onclick="sendEmoji('😂')" class="text-lg p-1.5 hover:bg-slate-800 rounded transition active:scale-90">😂</button>
          <button onclick="sendEmoji('😭')" class="text-lg p-1.5 hover:bg-slate-800 rounded transition active:scale-90">😭</button>
          <button onclick="sendEmoji('😱')" class="text-lg p-1.5 hover:bg-slate-800 rounded transition active:scale-90">😱</button>
          <button onclick="sendEmoji('🔥')" class="text-lg p-1.5 hover:bg-slate-800 rounded transition active:scale-90">🔥</button>
          <button onclick="sendEmoji('👍')" class="text-lg p-1.5 hover:bg-slate-800 rounded transition active:scale-90">👍</button>
        </div>
      </div>
    </div>

    <!-- Sidebar Chat -->
    <div class="w-full lg:w-80 bg-slate-950 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col h-64 lg:h-full shrink-0">
      
      <!-- Chat Header -->
      <div class="px-4 py-3 border-b border-slate-800 font-medium text-xs sm:text-sm text-slate-300 flex items-center justify-between bg-slate-900/50">
        <span>PESAN TEKS</span>
        <span id="typing-indicator" class="text-[11px] text-indigo-400 hidden">Sedang mengetik...</span>
      </div>

      <!-- Tempat Pesan Chat -->
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
        <div class="bg-slate-900 border border-slate-800/80 text-slate-400 p-3 rounded text-center leading-relaxed">
          Salin ID Anda ke pasangan untuk terhubung dan menonton bersama.
        </div>
      </div>

      <!-- Form Input Chat -->
      <form onsubmit="sendChatHandler(event)" class="p-3 border-t border-slate-800 flex gap-2 bg-slate-900/50">
        <input id="chat-input" type="text" oninput="handleTyping()" placeholder="Tulis pesan..." class="flex-1 bg-slate-900 border border-slate-800 rounded px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded text-xs font-medium transition">
          Kirim
        </button>
      </form>
    </div>

  </div>

  <script>
    // State Aplikasi
    let peer = null;
    let conn = null;
    let html5Player = null;
    let currentMode = 'yt'; // 'yt', 'vimeo', atau 'direct'
    let isRemoteAction = false;
    let currentVideoId = 'dQw4w9WgXcQ';
    let currentDirectUrl = '';
    let useNocookieDomain = false;
    let typingTimeout = null;

    // Inisialisasi Aplikasi saat DOM Siap
    window.addEventListener('DOMContentLoaded', () => {
      html5Player = document.getElementById('html5-player');
      setupHTML5PlayerEvents();
      initPeer();
    });

    function toggleYtDomain() {
      useNocookieDomain = !useNocookieDomain;
      const btn = document.getElementById('yt-domain-btn');
      if (useNocookieDomain) {
        btn.innerText = 'Domain: YouTube Nocookie';
        btn.className = 'text-[10px] bg-indigo-950 border border-indigo-800 px-2 py-1 rounded text-indigo-300 transition';
        showToast('Menggunakan domain youtube-nocookie.com', 'info');
      } else {
        btn.innerText = 'Domain: YouTube Standard';
        btn.className = 'text-[10px] bg-slate-900 border border-slate-800 hover:border-slate-700 px-2 py-1 rounded text-slate-400 transition';
        showToast('Menggunakan domain youtube.com', 'info');
      }

      if (currentMode === 'yt') {
        setYouTubeEmbed(currentVideoId);
      }
    }

    function setYouTubeEmbed(videoId) {
      currentMode = 'yt';
      currentVideoId = videoId;
      
      const embedContainer = document.getElementById('embed-player-container');
      embedContainer.classList.remove('hidden');
      html5Player.classList.add('hidden');
      if (html5Player) html5Player.pause();

      const domain = useNocookieDomain ? 'www.youtube-nocookie.com' : 'www.youtube.com';

      embedContainer.innerHTML = `
        <iframe 
          id="player-frame"
          class="w-full h-full"
          src="https://${domain}/embed/${videoId}?rel=0&autoplay=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      `;
    }

    function setVimeoEmbed(vimeoId) {
      currentMode = 'vimeo';
      currentVideoId = vimeoId;

      const embedContainer = document.getElementById('embed-player-container');
      embedContainer.classList.remove('hidden');
      html5Player.classList.add('hidden');
      if (html5Player) html5Player.pause();

      embedContainer.innerHTML = `
        <iframe 
          id="player-frame"
          class="w-full h-full"
          src="https://player.vimeo.com/video/${vimeoId}?autoplay=1"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      `;
    }

    function setDirectVideoEmbed(url) {
      currentMode = 'direct';
      currentDirectUrl = url;

      const embedContainer = document.getElementById('embed-player-container');
      embedContainer.classList.add('hidden');
      html5Player.classList.remove('hidden');

      html5Player.src = url;
      html5Player.play().catch(() => {});
    }

    // --- HTML5 Player Setup (MP4 Video) ---
    function setupHTML5PlayerEvents() {
      if (!html5Player) return;

      html5Player.addEventListener('play', () => {
        if (isRemoteAction || currentMode !== 'direct') return;
        sendData({ type: 'PLAYER_PLAY', time: html5Player.currentTime });
      });

      html5Player.addEventListener('pause', () => {
        if (isRemoteAction || currentMode !== 'direct') return;
        sendData({ type: 'PLAYER_PAUSE', time: html5Player.currentTime });
      });

      html5Player.addEventListener('seeked', () => {
        if (isRemoteAction || currentMode !== 'direct') return;
        sendData({ type: 'PLAYER_SEEK', time: html5Player.currentTime });
      });
    }

    // --- 1. SINKRONISASI PEERJS (P2P WEBRTC DENGAN STUN GOOGLE) ---
    function initPeer() {
      if (peer) {
        try { peer.destroy(); } catch(e){}
      }

      document.getElementById('my-id').innerText = "Menghubungkan...";

      // Konfigurasi dengan Google Public STUN Server untuk menembus proteksi jaringan
      const peerOptions = {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' }
          ]
        },
        debug: 1
      };

      try {
        peer = new Peer(peerOptions);

        peer.on('open', (id) => {
          document.getElementById('my-id').innerText = id;
          showToast('ID koneksi berhasil dibuat!', 'success');
        });

        peer.on('connection', (connection) => {
          conn = connection;
          setupConnectionHandlers();
          showToast('Menerima permintaan koneksi...', 'info');
        });

        peer.on('disconnected', () => {
          document.getElementById('my-id').innerText = "Terputus";
          showToast('Koneksi server terputus. Mencoba reconnect...', 'warning');
          if (peer && !peer.destroyed) {
            peer.reconnect();
          }
        });

        peer.on('error', (err) => {
          console.error('PeerJS Error:', err);
          document.getElementById('my-id').innerText = "Gagal Server";
          showToast('Gagal terhubung ke server: ' + (err.type || 'Error Jaringan'), 'error');
        });
      } catch (e) {
        console.error("Gagal menginisialisasi PeerJS:", e);
        showToast("Browser memblokir koneksi P2P WebRTC.", "error");
      }
    }

    function reconnectPeerServer() {
      showToast('Menghubungkan ulang ke server...', 'info');
      initPeer();
    }

    function connectToPartner() {
      const partnerId = document.getElementById('partner-id-input').value.trim();
      if (!partnerId) {
        showToast('Masukkan ID Pasangan terlebih dahulu.', 'warning');
        return;
      }
      if (peer && partnerId === peer.id) {
        showToast('Tidak dapat menghubungkan ke ID sendiri.', 'warning');
        return;
      }

      showToast('Menghubungkan ke pasangan...', 'info');
      conn = peer.connect(partnerId);
      setupConnectionHandlers();
    }

    function setupConnectionHandlers() {
      if (!conn) return;

      conn.on('open', () => {
        updateConnectionStatus(true);
        showToast('Terhubung dengan pasangan!', 'success');
        appendSystemMessage('Sistem: Koneksi P2P tersambung.');

        sendData({ type: 'REQUEST_SYNC' });
      });

      conn.on('data', (data) => {
        handleIncomingData(data);
      });

      conn.on('close', () => {
        updateConnectionStatus(false);
        showToast('Koneksi pasangan terputus.', 'warning');
        appendSystemMessage('Sistem: Koneksi pasangan terputus.');
      });

      conn.on('error', (err) => {
        console.error('Connection error:', err);
        showToast('Gagal menyambung ke pasangan.', 'error');
      });
    }

    function updateConnectionStatus(isConnected) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');

      if (isConnected) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        text.innerText = 'Terhubung';
        text.className = 'text-emerald-400';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
        text.innerText = 'Belum Terhubung';
        text.className = 'text-slate-400';
      }
    }

    function sendData(data) {
      if (conn && conn.open) {
        conn.send(data);
      }
    }

    function sendSyncSignal(action) {
      sendData({ type: 'SYNC_SIGNAL', action: action });
      showToast('Aba-aba dikirim ke pasangan.', 'info');
    }

    // --- 2. LOGIKA HANDLING DATA MASUK ---
    function handleIncomingData(data) {
      isRemoteAction = true;

      switch (data.type) {
        case 'REQUEST_SYNC':
          if (currentMode === 'yt') {
            sendData({ type: 'SYNC_RESPONSE', mode: 'yt', videoId: currentVideoId });
          } else if (currentMode === 'vimeo') {
            sendData({ type: 'SYNC_RESPONSE', mode: 'vimeo', videoId: currentVideoId });
          } else {
            sendData({
              type: 'SYNC_RESPONSE',
              mode: 'direct',
              url: currentDirectUrl,
              time: html5Player.currentTime,
              isPlaying: !html5Player.paused
            });
          }
          break;

        case 'SYNC_RESPONSE':
          if (data.mode === 'yt') {
            setYouTubeEmbed(data.videoId);
          } else if (data.mode === 'vimeo') {
            setVimeoEmbed(data.videoId);
          } else if (data.mode === 'direct') {
            setDirectVideoEmbed(data.url);
            html5Player.currentTime = data.time;
            if (data.isPlaying) html5Player.play();
          }
          break;

        case 'SYNC_SIGNAL':
          if (data.action === 'PLAY') {
            showToast('Pasangan memberi aba-aba: TEKAN PLAY SEKARANG!', 'warning');
            appendSystemMessage('Aba-aba Pasangan: Tekan tombol Play di video!');
          } else if (data.action === 'PAUSE') {
            showToast('Pasangan memberi aba-aba: TEKAN PAUSE!', 'warning');
            appendSystemMessage('Aba-aba Pasangan: Pause video!');
          }
          break;

        case 'PLAYER_PLAY':
          if (currentMode === 'direct' && html5Player) {
            if (Math.abs(html5Player.currentTime - data.time) > 1.2) {
              html5Player.currentTime = data.time;
            }
            html5Player.play();
          }
          break;

        case 'PLAYER_PAUSE':
          if (currentMode === 'direct' && html5Player) {
            html5Player.currentTime = data.time;
            html5Player.pause();
          }
          break;

        case 'PLAYER_SEEK':
          if (currentMode === 'direct' && html5Player) {
            html5Player.currentTime = data.time;
          }
          break;

        case 'CHANGE_VIDEO':
          if (data.mode === 'yt') {
            setYouTubeEmbed(data.videoId);
          } else if (data.mode === 'vimeo') {
            setVimeoEmbed(data.videoId);
          } else if (data.mode === 'direct') {
            setDirectVideoEmbed(data.url);
          }
          appendSystemMessage(`Sistem: Pasangan mengganti video.`);
          showToast('Video diganti oleh pasangan.', 'info');
          break;

        case 'CHAT':
          appendChatMessage(data.text, 'partner', data.time);
          break;

        case 'EMOJI':
          triggerFloatingEmoji(data.emoji);
          break;

        case 'TYPING':
          showPartnerTyping();
          break;
      }

      setTimeout(() => { isRemoteAction = false; }, 500);
    }

    // --- 3. KONTROL USER ---
    function changeVideoHandler(e) {
      e.preventDefault();
      const input = document.getElementById('video-url-input');
      const url = input.value.trim();
      if (!url) return;

      const ytId = extractYouTubeId(url);
      const vimeoId = extractVimeoId(url);

      if (ytId) {
        loadYouTubeVideo(ytId);
      } else if (vimeoId) {
        loadVimeoVideo(vimeoId);
      } else if (url.startsWith('http://') || url.startsWith('https://')) {
        loadDirectVideo(url);
      } else {
        showToast('URL tidak valid.', 'error');
      }

      input.value = '';
    }

    function loadSampleVideo(source, type) {
      if (type === 'yt') {
        loadYouTubeVideo(source);
      } else if (type === 'vimeo') {
        loadVimeoVideo(source);
      } else {
        loadDirectVideo(source);
      }
    }

    function loadYouTubeVideo(videoId) {
      setYouTubeEmbed(videoId);
      sendData({ type: 'CHANGE_VIDEO', mode: 'yt', videoId: videoId });
      showToast('Video YouTube dimuat.', 'success');
    }

    function loadVimeoVideo(vimeoId) {
      setVimeoEmbed(vimeoId);
      sendData({ type: 'CHANGE_VIDEO', mode: 'vimeo', videoId: vimeoId });
      showToast('Video Vimeo dimuat.', 'success');
    }

    function loadDirectVideo(url) {
      setDirectVideoEmbed(url);
      sendData({ type: 'CHANGE_VIDEO', mode: 'direct', url: url });
      showToast('Video MP4 dimuat.', 'success');
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function extractVimeoId(url) {
      const regExp = /(?:vimeo)\.com\/(?:channels\/(?:\w+\/)?|groups\/[^\/]*\/videos\/|album\/\d+\/video\/|video\/|)(\d+)/;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function sendChatHandler(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      appendChatMessage(text, 'me', timeStr);
      sendData({ type: 'CHAT', text: text, time: timeStr });

      input.value = '';
    }

    function handleTyping() {
      sendData({ type: 'TYPING' });
    }

    function showPartnerTyping() {
      const el = document.getElementById('typing-indicator');
      el.classList.remove('hidden');
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        el.classList.add('hidden');
      }, 2000);
    }

    function sendEmoji(emoji) {
      triggerFloatingEmoji(emoji);
      sendData({ type: 'EMOJI', emoji: emoji });
    }

    // --- 4. TAMPILAN PADA LAYAR ---
    function triggerFloatingEmoji(emoji) {
      const overlay = document.getElementById('emoji-overlay');
      const el = document.createElement('div');
      el.innerText = emoji;

      const randomLeft = Math.floor(Math.random() * 70) + 15;
      el.style.left = randomLeft + '%';
      el.style.bottom = '15px';
      el.className = 'absolute text-3xl sm:text-4xl pointer-events-none select-none transition-all duration-1000 ease-out transform translate-y-0 opacity-100';

      overlay.appendChild(el);

      requestAnimationFrame(() => {
        setTimeout(() => {
          el.style.transform = 'translateY(-160px) scale(1.2)';
          el.style.opacity = '0';
        }, 50);
      });

      setTimeout(() => { el.remove(); }, 1100);
    }

    function appendChatMessage(text, sender, time = '') {
      const chatBox = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      const isMe = sender === 'me';

      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

      const msgBubble = document.createElement('div');
      msgBubble.className = `px-3 py-2 rounded max-w-[85%] break-words leading-relaxed ${
        isMe
          ? 'bg-indigo-600 text-white'
          : 'bg-slate-900 text-slate-200 border border-slate-800'
      }`;
      msgBubble.innerText = text;

      const timeStamp = document.createElement('span');
      timeStamp.className = 'text-[10px] text-slate-500 mt-1';
      timeStamp.innerText = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      wrapper.appendChild(msgBubble);
      wrapper.appendChild(timeStamp);
      chatBox.appendChild(wrapper);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendSystemMessage(text) {
      const chatBox = document.getElementById('chat-messages');
      const msg = document.createElement('div');
      msg.className = 'bg-slate-900/40 border border-slate-800/60 text-slate-500 text-[11px] p-2 rounded text-center my-1';
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Utility: Copy ID
    function copyMyId() {
      const myId = document.getElementById('my-id').innerText;
      if (!myId || myId === 'Menghubungkan...' || myId === 'Gagal Server') return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(myId).then(() => {
          showToast('ID berhasil disalin.', 'success');
        }).catch(() => {
          fallbackCopy(myId);
        });
      } else {
        fallbackCopy(myId);
      }
    }

    function fallbackCopy(text) {
      const input = document.createElement('input');
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      showToast('ID berhasil disalin.', 'success');
    }

    // Utility: Custom Toast System
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const bgColors = {
        success: 'bg-slate-900 border-slate-700 text-emerald-400',
        error: 'bg-slate-900 border-slate-700 text-rose-400',
        warning: 'bg-slate-900 border-slate-700 text-amber-400',
        info: 'bg-slate-900 border-slate-800 text-slate-200'
      };

      toast.className = `px-3.5 py-2 rounded border text-xs font-medium shadow-lg backdrop-blur flex items-center transition-all duration-200 transform translate-y-[-5px] opacity-0 ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `<span>${message}</span>`;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-[-5px]', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-5px]');
        setTimeout(() => { toast.remove(); }, 200);
      }, 2500);
    }
  </script>
</body>
